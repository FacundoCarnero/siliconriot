# ─────────────────────────────────────────────────────────────
# Silicon Riot — Cloudflare Worker configuration
#
# Deployment: `wrangler deploy` (requires `wrangler login`).
# Do NOT commit secrets here — RESEND_API_KEY is set in the
# Cloudflare dashboard (Settings → Variables and Secrets).
#
# NOTE: account_id is intentionally omitted. The deploy step picks
# it from your wrangler login. Run `wrangler login` before deploying.
# ─────────────────────────────────────────────────────────────

name = "siliconriot-verify"
main = "cloudflare-worker.js"
compatibility_date = "2024-01-01"

[durable_objects]
bindings = [
  { name = "VISIT_COUNTER", class_name = "VisitCounter" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["VisitCounter"]
